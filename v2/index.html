(()=>{'use strict';const KEY='taxipro2_preview_local_v1';let page='dashboard',map=null,gpsWatch=null,driverTab='orders';const now=()=>new Date().toISOString(),today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const fresh=()=>({drivers:[{id:'d1',name:'Demo-Fahrer 01',car:'ME-TX 101',status:'free',lng:7.028,lat:50.624},{id:'d2',name:'Demo-Fahrer 02',car:'ME-TX 202',status:'busy',lng:7.052,lat:50.636},{id:'d3',name:'Demo-Fahrer 03',car:'ME-TX 303',status:'enroute',lng:7.015,lat:50.611},{id:'d4',name:'Demo-Fahrer 04',car:'ME-TX 404',status:'offline',lng:7.043,lat:50.619}],customers:[{id:'c1',name:'Testkunde 01',from:'Neuer Markt, Meckenheim',to:'Bonn Hauptbahnhof',kind:'Rechnungsfahrt',sign:false},{id:'c2',name:'Testkunde 02',from:'Bahnhof Meckenheim',to:'Universitätsklinikum Bonn',kind:'Krankenfahrt',sign:true},{id:'c3',name:'Testkunde 03',from:'Merler Ring, Meckenheim',to:'Rheinbach Bahnhof',kind:'Serienfahrt',sign:true}],rides:[{id:'TP-1001',cid:'c2',did:'d2',from:'Bahnhof Meckenheim',to:'Universitätsklinikum Bonn',kind:'Krankenfahrt',direction:'hin',sign:true,time:'08:15',date:today(),status:'accepted',accepted:now(),completed:null},{id:'TP-1002',cid:'c1',did:'d3',from:'Neuer Markt, Meckenheim',to:'Bonn Hauptbahnhof',kind:'Rechnungsfahrt',direction:'hin',sign:false,time:'10:30',date:today(),status:'assigned',accepted:null,completed:null}],chat:[{who:'Zentrale',body:'Willkommen in der TaxiPro 2.0 Demovorschau. Diese Nachricht bleibt nur im Browser.',at:now()}],shiftStart:null,shifts:[],geo:null,audit:[],counter:1002});let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch{}if(!s||!Array.isArray(s.drivers)||!Array.isArray(s.rides))s=fresh();
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch{toast('Lokaler Speicher nicht verfügbar.')}};const cust=id=>s.customers.find(x=>x.id===id),drv=id=>s.drivers.find(x=>x.id===id);const fmt=t=>t?new Date(t).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'}):'—';const duration=ms=>{const n=Math.max(0,Math.floor(ms/1000));return [Math.floor(n/3600),Math.floor(n/60)%60,n%60].map(x=>String(x).padStart(2,'0')).join(':')};const active=()=>s.shiftStart?Date.now()-new Date(s.shiftStart):0;const total=days=>s.shifts.filter(x=>new Date(x.end)>=new Date(Date.now()-days*86400000)).reduce((a,x)=>a+new Date(x.end)-new Date(x.start),0)+active();const label={free:'Frei',busy:'Besetzt',enroute:'Unterwegs',offline:'Offline',assigned:'Zugewiesen',accepted:'Angenommen',done:'Abgeschlossen'};const badge=st=>'<span class="status '+esc(st)+'">'+esc(label[st]||st)+'</span>';const title=(name,sub,button='')=>'<div class="head"><div><h2>'+name+'</h2><p>'+sub+'</p></div>'+button+'</div>';const stat=(n,v,sub)=>'<div class="stat"><small>'+n+'</small><strong>'+v+'</strong><span>'+sub+'</span></div>';const log=(act,detail)=>{s.audit.unshift({at:now(),act,detail});s.audit=s.audit.slice(0,200)};function toast(text){const e=$('toast');e.textContent=text;e.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.style.display='none',3700)}

function dashboard(){return title('Heute im Blick','Fahrer, Aufträge, Fahrten und Schichten auf einer Oberfläche','<button class="btn" data-action="reset">Demo zurücksetzen</button>')+'<p class="notice">Interaktive <b>lokale Demo</b>: alle Namen und Fahrzeugpositionen sind erfunden. Aufträge, GPS und Nachrichten werden noch <b>nicht</b> an andere Geräte übertragen.</p><div class="stats">'+stat('Fahrer verfügbar',s.drivers.filter(x=>x.status==='free').length+' / '+s.drivers.length,'● Aktueller Demostatus')+stat('Fahrten heute',s.rides.filter(x=>x.date===today()).length,'● Geplant und dokumentiert')+stat('Abgeschlossene Fahrten',s.rides.filter(x=>x.status==='done').length,'● Mit Ereigniszeitstempel')+stat('Unterschriften offen',s.rides.filter(x=>x.sign&&x.status!=='done').length,'● Ausstehende Demobelege')+'</div><div class="main-grid"><div class="card"><div class="card-title"><div><b>Flottenkarte · Meckenheim</b><br><small>3D-Kartenansicht · nur Musterpositionen</small></div><button class="btn" data-action="3d">3D ↗</button></div><div class="map" id="map"><div class="map-graphic"><div class="map-pins"><span class="pin" style="left:45%;top:50%">🚕</span><span class="pin busy" style="left:72%;top:35%">🚕</span><span class="pin enroute" style="left:30%;top:65%">🚕</span><span class="pin offline" style="left:62%;top:75%">🚕</span></div></div></div><div class="legend"><span><i style="background:var(--green)"></i> Frei</span><span><i style="background:var(--red)"></i> Besetzt</span><span><i style="background:var(--yellow)"></i> Unterwegs</span><span><i style="background:#9cabb9"></i> Offline</span></div></div><div class="card"><div class="card-title"><b>Flottenstatus</b><button class="btn" data-page="driver">Fahrer-App ↗</button></div><div class="fleet">'+fleet()+'</div></div></div><div class="two"><div class="card"><div class="card-title"><b>Aktuelle Aufträge</b><button class="btn" data-page="rides">Alle ansehen</button></div><div class="fleet">'+recent()+'</div></div><div cl function dispatch(){return title('Neuer Fahrauftrag','Kundendaten, Fahrtrichtung, Fahrer und Abholzeit in einem Schritt')+'<p class="notice">Hier erstellte Aufträge erscheinen innerhalb dieses Browsers in der Fahrer-Testansicht. Eine echte Übertragung an fremde Smartphones ist noch nicht angeschlossen.</p><div class="main-grid"><div class="card"><div class="card-title"><b>Auftrag anlegen</b><small>Testumgebung</small></div><div class="card-body"><form id="order-form" class="form-grid"><div class="field"><label for="cid">Kunde</label><select id="cid">'+options(s.customers.map(c=>[c.id,c.name+' · '+c.kind]),'c1')+'</select></div><div class="field"><label for="did">Fahrer</label><select id="did">'+options(s.drivers.map(d=>[d.id,d.name+' · '+d.car]),'d1')+'</select></div><div class="field"><label for="kind">Fahrtart</label><select id="kind"><option>Krankenfahrt</option><option>Rechnungsfahrt</option><option>Serienfahrt</option><option>Barfahrt</option></select></div><div class="field"><label for="direction">Richtung</label><select id="direction"><option value="hin">Hinfahrt</option><option value="rueck">Rückfahrt</option></select></div><div class="field wide"><label for="from">Abholung</label><input id="from" maxlength="180" required></div><div class="field wide"><label for="to">Ziel</label><input id="to" maxlength="180" required></div><div class="field"><label for="date">Datum</label><input id="date" type="date" required value="'+today()+'"></div><div class="field"><label for="time">Abholzeit</label><input id="time" type="time" required value="12:30"></div><div class="field wide"><label><input type="checkbox" id="sign" style="width:auto;margin-right:7px">Unterschrift erforderlich</label></div><div class="field wide"><button class="btn gold" type="submit">↗ Auftrag dem Fahrer zuweisen</button></div></form></div></div><div class="card"><div class="card-title"><b>Intelligente Auftragsvorbereitung</b></div><div class="card-body"><div class="hint">Wähle einen Kunden aus: Fahrtart, Strecke und Unterschriftsbedarf werden vorbelegt.<br><br>Wähle Rückfahrt: Start und Ziel werden automatisch getauscht.<br><br>Weise den Auftrag Demo-Fahrer 01 zu und öffne danach die Fahrer-App, um ihn anzunehmen und abzuschließen.</div><p class="mini" style="margin-top:15px">Der Status „zugestellt“ ist in der Demo absichtlich nicht enthalten: Eine tatsächliche Zustellung kann ohne Server nicht bestätigt werden.</p></div></div></div>'}

function rides(){return title('Fahrten & Serien','Hinfahrt, Rückfahrt und Fahrtstatus nach Kunden-ID und Datum','<button class="btn gold" data-page="dispatch">+ Neuer Auftrag</button>')+'<div class="card"><div class="card-title"><b>Fahrtenjournal</b><small>Lokale Aufträge · keine reale Abrechnung</small></div>'+rideTable()+'</div><div class="two"><div class="card"><div class="card-title"><b>Serienfahrten-Erkennung</b></div><div class="card-body"><div class="hint">Kunde + Datum + Richtung ergeben eine verlässliche Grundlage für den Tagesnachweis. Hin- und Rückfahrten bleiben getrennt. Bei Mehrdeutigkeiten ist eine manuelle Bestätigung notwendig.</div></div></div><div class="card"><div class="card-title"><b>Ereignisprotokoll</b></div><div class="card-body">'+(s.audit.length?s.audit.slice(0,8).map(a=>'<p class="mini">'+fmt(a.at)+' · '+esc(a.act)+' · '+esc(a.detail)+'</p>').join(''):'<p class="mini">Keine neuen Aktionen.</p>')+'</div></div></div>'}
function shifts(){return title('Arbeitszeiten','Schichtkarte und Wochenübersicht für Demo-Fahrer 01','<button class="btn" data-action="print">Drucken / PDF</button>')+'<div class="stats">'+stat('Aktuelle Schicht',duration(active()),s.shiftStart?'Gestartet '+fmt(s.shiftStart):'Nicht aktiv')+stat('Letzte 7 Tage',duration(total(7)),'Inklusive laufender Schicht')+stat('Letzte 30 Tage',duration(total(30)),'Bruttodauer')+stat('Schichten dokumentiert',s.shifts.length,'Lokal gespeicherte Schichten')+'</div><div class="card"><div class="card-title"><b>Schichtjournal · Demo-Fahrer 01</b><button class="btn" data-page="driver">Fahrer-App öffnen</button></div><div class="tblwrap"><table class="tbl"><thead><tr><th>Beginn</th><th>Ende</th><th>Bruttodauer</th><th>Hinweis</th></tr></thead><tbody>'+s.shifts.slice().reverse().map(x=>'<tr><td>'+fmt(x.start)+'</td><td>'+fmt(x.end)+'</td><td>'+duration(new Date(x.end)-new Date(x.start))+'</td><td>Pausen noch nicht erfasst</td></tr>').join('')+(s.shiftStart?'<tr><td>'+fmt(s.shiftStart)+'</td><td>Aktiv</td><td>'+duration(active())+'</td><td>Laufend</td></tr>':'')+'</tbody></table></div><div class="card-body mini">In der Demo handelt es sich nur um Brutto-Schichtzeiten. Die produktive Umsetzung braucht eine rechtlich korrekte Pausenerfassung und ein fälschungssicheres Korrekturprotokoll.</div></div>'}
function customers(){return title('Kundenstamm','Einmalige Anlage, wiederverwendbare Fahrtvorlagen')+'<p class="notice">Alle Testkunden sind erfunden. Bitte in dieser Vorschau keine echten Kunden- oder Gesundheitsdaten erfassen.</p><div class="card"><div class="card-title"><b>Beispielkunden</b><small>Reine Demodaten</small></div><div class="tblwrap"><table class="tbl"><thead><tr><th>Name</th><th>Abholadresse</th><th>Fahrtart</th><th>Ziel</th><th>Unterschrift</th></tr></thead><tbody>'+s.customers.map(c=>'<tr><td>'+esc(c.name)+'</td><td>'+esc(c.from)+'</td><td>'+esc(c.kind)+'</td><td>'+esc(c.to)+'</td><td>'+(c.sign?'Erforderlich':'Nicht erforderlich')+'</td></tr>').join('')+'</tbody></table></div></div>'}
function chat(){return title('Messenger','Test einer Zentrale-Fahrer-Kommunikationsoberfläche')+'<div class="main-grid"><div class="card"><div class="card-title"><b>Teamchat (lokal)</b><small>Keine tatsächliche Nachrichtenübertragung</small></div><div class="messages" id="messages">'+s.chat.map(m=>'<div class="message '+(m.who==='Zentrale'?'mine':'')+'"><b>'+esc(m.who)+'</b><br>'+esc(m.body)+'<small>'+fmt(m.at)+'</small></div>').join('')+'</div><form class="chat-form" id="chat-form"><input id="msg" maxlength="500" placeholder="Nachricht schreiben …" required><button class="btn gold">Senden</button></form></div><div class="card"><div class="card-title"><b>Spätere Sicherheitsfunktionen</b></div><div class="card-body"><div class="hint">✓ Einzelchat Disponent ↔ Fahrer<br>✓ Gruppenchat mit Rollen<br>✓ Empfangs- und Lesebestätigungen<br>✓ Gesicherte Dateianhänge<br>✓ Private Fahrerbereiche<br><br>Der aktuelle Chat ist nur eine Oberflächen-Demo.</div></div></div></div>'}
function documents(){return title('Dokumente & Nachweise','Vorschau für die Kameraerfassung, ohne Upload')+'<p class="notice">Bitte keine echten Verordnungen, Ausweise oder Patientenfotos auswählen. Eine rechtssichere Dokumentenspeicherung und Upload-Verschlüsselung sind noch nicht implementiert.</p><div class="two"><div class="card"><div class="card-title"><b>Lokale Kamera-/Bildvorschau</b></div><div class="card-body"><div class="field"><label for="scan">Nur Testbild auswählen</label><input id="scan" type="file" accept="image/*" capture="environment"></div><p class="mini" id="scan-info">Das Bild wird ausschließlich auf deinem Gerät betrachtet und nicht gespeichert.</p><div id="scan-preview"></div></div></div><div class="card"><div class="card-title"><b>Fahrtunterschriften</b></div><div class="card-body"><div class="hint">Der spätere digitale Beleg wird einem konkreten Auftrag und einer eindeutigen Hinfahrt oder Rückfahrt zugeordnet. Vor echtem Einsatz ist die Anerkennung bei der zuständigen Abrechnungsstelle zu klären.<br><br>Keine rechtswirksamen Unterschriften werden in dieser Demo erhoben.</div></div></div></div>'}
function driver(){const d=s.drivers[0];const orders=s.rides.filter(r=>r.did==='d1').slice().reverse();return title('Fahrer-App','Mobile Schicht- und Auftragsansicht · Demo-Fahrer 01','<button class="btn" data-page="dashboard">Zentrale ↗</button>')+'<p class="notice">Dies ist keine echte Fahrer-Anmeldung. Innerhalb dieser Vorschau kannst du jederzeit zwischen Zentrale und Fahrer wechseln. Private Nutzerdaten müssen später serverseitig geschützt werden.</p><div class="driver"><div class="shift"><div class="sub-header"><h3>🚕 '+esc(d.name)+'</h3>'+badge(s.shiftStart?d.status:'offline')+'</div><div class="mini" style="margin-top:22px">AKTUELLE SCHICHTZEIT</div><div id="shiftClock" class="shift-time">'+duration(active())+'</div><div class="mini">'+(s.shiftStart?'Beginn: '+fmt(s.shiftStart):'Schicht nicht aktiv')+'</div><div class="toolbar" style="justify-content:center;margin-top:19px"><button class="btn '+(s.shiftStart?'red':'gold')+'" data-action="shift">'+(s.shiftStart?'■ Schicht beenden':'▶ Schicht beginnen')+'</button><button class="btn" data-action="gps" '+(!s.shiftStart?'disabled':'')+'>'+(gpsWatch===null?'⌖ GPS erlauben':'◉ GPS stoppen')+'</button></div><p class="mini">GPS nur nach Erlaubnis und nur solange die PWA aktiv läuft. Keine Übertragung auf andere Geräte.</p></div><div class="driver-tabs"><button class="btn '+(driverTab==='orders'?'selected':'')+'" data-driver="orders">Aufträge</button><button class="btn '+(driverTab==='time'?'selected':'')+'" data-driver="time">Zeiten</button><button class="btn '+(driverTab==='messages'?'selected':'')+'" data-driver="messages">Nachrichten</button></div>'+(driverTab==='orders'?'<div class="card"><div class="card-title"><b>Meine Aufträge</b><span class="tag">'+orders.filter(x=>x.status!=='done').length+' offen</span></div>'+(orders.length?orders.map(r=>'<div class="card-trip"><div class="sub-header"><b class="primary">'+esc(cust(r.cid)?.name)+' · '+esc(r.time)+' Uhr</b>'+badge(r.status)+'</div><p class="subtle">'+esc(r.direction==='hin'?'Hinfahrt':'Rückfahrt')+' · '+esc(r.kind)+'</p><p>'+esc(r.from)+'<br><span style="color:var(--gold)">↓</span><br>'+esc(r.to)+'</p>'+(r.sign?'<p class="subtle">✍ Unterschrift erforderlich (noch kein digitaler Beleg)</p>':'')+'<div class="toolbar"><button class="btn" data-action="nav" data-id="'+esc(r.id)+'">↗ Navigation</button>'+(r.status==='assigned'?'<button class="btn gold" data-action="accept" data-id="'+esc(r.id)+'">Annehmen</button>':'')+(r.status==='accepted'?'<button class="btn green" data-action="complete" data-id="'+esc(r.id)+'">Fahrt abschließen</button>':'')+'</div></div>').join(''):'<div class="empty">Keine zugewiesenen Fahrten. Erstelle in der Disposition einen Auftrag für Demo-Fahrer 01.</div>')+'</div>':driverTab==='time'?'<div class="card"><div class="card-title"><b>Meine Schichtkarte</b><button class="btn" data-action="print">Drucken / PDF</button></div><div class="card-body"><div class="hint">Laufende Schicht: '+duration(active())+'<br>Letzte 7 Tage: '+duration(total(7))+'<br>Erfasste Schichten: '+s.shifts.length+'</div></div></div>':'<div class="card"><div class="card-title"><b>Private Nachrichten</b></div><div class="card-body"><button class="btn" data-page="chat">Messenger öffnen</button></div></div>')+(s.geo?'<p class="hint" style="margin-top:15px">Letzte lokal gemessene GPS-Position: '+Number(s.geo.lat).toFixed(5)+', '+Number(s.geo.lng).toFixed(5)+' · '+fmt(s.geo.at)+'<br>Kein Hintergrund-Tracking oder GPS-Sync.</p>':'')+'</div>'}

let daySelected=today();
function daily(){
const records=s.rides.filter(r=>r.date===daySelected),groups=new Map();
records.forEach(r=>{let a=groups.get(r.cid);if(!a){a={name:cust(r.cid)?.name||'Kunde',hin:[],rueck:[]};groups.set(r.cid,a)}a[r.direction==='hin'?'hin':'rueck'].push(r)});
const complete=records.filter(r=>r.status==='done').length;
const missingSign=records.filter(r=>r.sign&&r.status==='done').length;
const unfinished=records.filter(r=>r.status!=='done'&&r.status!=='cancelled').length;
const list=[...groups.values()].map(a=>{
const leg=(rows,typ)=>'<div class="pair-leg"><strong>'+typ+'</strong>'+(rows.length?rows.map(r=>'<div style="margin-top:9px">'+badge(r.status)+'<p class="mini">'+esc(r.time)+' Uhr · '+esc(drv(r.did)?.name||'')+'<br>'+esc(r.from)+' → '+esc(r.to)+'</p>'+(r.sign?'<p class="mini" style="color:var(--yellow)">Unterschrift erforderlich (nicht digital erfasst)</p>':'')+'</div>').join(''):'<p class="mini">Keine Fahrt eingetragen</p>')+'</div>';
return '<div class="pair"><div class="pair-top"><b>'+esc(a.name)+'</b><span class="tag">'+(a.hin.length+a.rueck.length)+' Fahrt(en)</span></div><div class="pair-cols">'+leg(a.hin,'Hinfahrt')+leg(a.rueck,'Rückfahrt')+'</div></div>';}).join('')||'<div class="empty">Keine Fahrten an diesem Tag vorhanden.</div>';
return title('Tageskontrolle','Kundenbezogene Hin- und Rückfahrten · automatisch gruppiert')+'<div class="hint" style="margin-bottom:16px">Testmodus: Die Kontrollen basieren auf lokal gespeicherten Aufträgen. Ein fehlender Rückfahrt-Eintrag bedeutet nicht zwingend, dass eine Rückfahrt bestellt war. Belege werden nicht als unterschrieben ausgegeben.</div>'+
'<div class="day-controls"><label>Datum <input id="daySelected" type="date" value="'+esc(daySelected)+'"></label><button class="btn" data-action="today">Heute</button><button class="btn" data-action="print">Tagesübersicht als PDF</button></div>'+
'<div class="stats">'+stat('Fahrten am Tag',records.length,'Erfasste Aufträge')+stat('Abgeschlossen',complete,'Mit Abschlusszeit')+stat('Noch offen',unfinished,'Zu disponieren')+stat('Belege prüfen',missingSign,'Unterschrift noch nicht erfasst')+'</div><div class="pairs">'+list+'</div>'}
const views={dashboard:['Flottenübersicht',dashboard],dispatch:['Disposition',dispatch],rides:['Fahrten & Serien',rides],daily:['Tageskontrolle',daily],shifts:['Arbeitszeiten',shifts],customers:['Kundenstamm',customers],chat:['Messenger',chat],documents:['Dokumente',documents],driver:['Fahrer-App',driver]};function render(p){page=views[p]?p:'dashboard';$('crumb').textContent=views[page][0];$('heading').textContent=views[page][0];document.querySelectorAll('.nav [data-page]').forEach(n=>n.classList.toggle('active',n.dataset.page===page));$('view').innerHTML=views[page][1]();$('nav').classList.remove('open');if(page==='dashboard')setTimeout(buildMap,60);if(page==='dispatch')setTimeout(bindDispatch,0);if(page==='chat'){const m=$('messages');if(m)m.scrollTop=m.scrollHeight}}
function bindDispatch(){const select=$('cid');if(!select)return;function preset(){const c=cust(select.value);if(!c)return;$('kind').value=c.kind;$('from').value=c.from;$('to').value=c.to;$('sign').checked=c.sign;$('direction').value='hin'}select.onchange=preset;$('direction').onchange=()=>{const a=$('from').value;$('from').value=$('to').value;$('to').value=a};preset()}
function buildMap(){if(!$('map')||!window.maplibregl)return;try{map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[7.032,50.624],zoom:12.3,pitch:35,antialias:true});map.addControl(new maplibregl.NavigationControl(),'top-right');s.drivers.forEach(d=>{const el=document.createElement('div');el.className='pin '+d.status;el.style.position='relative';el.style.transform='none';el.textContent='🚕';new maplibregl.Marker({element:el}).setLngLat([d.lng,d.lat]).setPopup(new maplibregl.Popup({offset:18}).setHTML('<b>'+esc(d.name)+'</b><br>'+esc(d.car)+'<br>SIMULIERTE POSITION')).addTo(map)})}catch(e){map=null}}
function stopGPS(){if(gpsWatch!==null&&navigator.geolocation)navigator.geolocation.clearWatch(gpsWatch);gpsWatch=null}function shift(){if(s.shiftStart){const end=now();s.shifts.push({start:s.shiftStart,end});log('Schichtende','Demo-Fahrer 01');s.shiftStart=null;s.drivers[0].status='offline';stopGPS()}else{s.shiftStart=now();log('Schichtbeginn','Demo-Fahrer 01');s.drivers[0].status='free'}save();render('driver')}function gps(){if(gpsWatch!==null){stopGPS();render('driver');toast('Lokale Ortung gestoppt.');return}if(!s.shiftStart){toast('Erst die Schicht beginnen.');return}if(!navigator.geolocation){toast('Standortzugriff wird hier nicht unterstützt.');return}gpsWatch=navigator.geolocation.watchPosition(p=>{s.geo={lat:p.coords.latitude,lng:p.coords.longitude,at:now()};save()},err=>{stopGPS();render('driver');toast(err.code===1?'GPS-Freigabe abgelehnt.':'GPS derzeit nicht verfügbar.')},{enableHighAccuracy:true,maximumAge:15000,timeout:20000});render('driver');toast('Standort wird nur lokal gelesen, niemals an die Zentrale gesendet.')}
function changeRide(id,action){const r=s.rides.find(x=>x.id===id);if(!r||r.did!=='d1')return;if(action==='accept'&&r.status==='assigned'){r.status='accepted';r.accepted=now();s.drivers[0].status='busy';log('Auftrag angenommen',id)}else if(action==='complete'&&r.status==='accepted'){r.status='done';r.completed=now();s.drivers[0].status='free';log('Fahrt abgeschlossen',id)}else return;save();render('driver');toast('Demo-Auftrag '+id+': '+label[r.status])}
function download(){const blob=new Blob([JSON.stringify({demo:true,exported:now(),data:s},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='taxipro-demo-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Testdaten exportiert.')}function reset(){if(!confirm('Alle lokalen Änderungen an dieser Demovorschau zurücksetzen?'))return;stopGPS();s=fresh();save();render('dashboard');toast('Demodaten zurückgesetzt.')}
document.addEventListener('click',e=>{const pageBtn=e.target.closest('[data-page]');if(pageBtn){render(pageBtn.dataset.page);return}const tab=e.target.closest('[data-driver]');if(tab){driverTab=tab.dataset.driver;render('driver');return}const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,id=b.dataset.id;if(action==='shift')shift();if(action==='gps')gps();if(action==='reset')reset();if(action==='accept'||action==='complete')changeRide(id,action);if(action==='print')window.print();if(action==='today'){daySelected=today();render('daily')};if(action==='3d'&&map)map.easeTo({pitch:map.getPitch()>45?0:65,bearing:map.getBearing()?0:-20,duration:700});if(action==='nav'){const r=s.rides.find(x=>x.id===id);if(r)window.open('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(r.to),'_blank','noopener,noreferrer')}});
document.addEventListener('submit',e=>{if(e.target.id==='order-form'){e.preventDefault();const form=id=>$(id).value;const r={id:'TP-'+(++s.counter),cid:form('cid'),did:form('did'),kind:form('kind'),direction:form('direction'),from:form('from').trim(),to:form('to').trim(),date:form('date'),time:form('time'),sign:$('sign').checked,status:'assigned',accepted:null,completed:null};if(!r.from||!r.to){toast('Bitte Start- und Zieladresse eingeben.');return}s.rides.push(r);log('Auftrag erstellt',r.id+' an '+drv(r.did).name);save();render('rides');toast('Auftrag '+r.id+' lokal angelegt – nicht an ein anderes Gerät gesendet.')}if(e.target.id==='chat-form'){e.preventDefault();const text=$('msg').value.trim();if(!text)return;s.chat.push({who:'Zentrale',body:text,at:now()});save();render('chat');toast('Nachricht nur lokal gespeichert.')}});
document.addEventListener('change',e=>{if(e.target.id==='daySelected'){daySelected=e.target.value;render('daily');return}if(e.target.id!=='scan')return;const file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')||file.size>12*1024*1024){$('scan-info').textContent='Nur Bilder bis 12 MB für die lokale Ansicht.';return}const url=URL.createObjectURL(file);const img=new Image();img.alt='Lokale Vorschau';img.style='width:100%;max-height:290px;object-fit:contain;border-radius:12px;margin-top:12px';img.onload=()=>URL.revokeObjectURL(url);img.src=url;$('scan-preview').replaceChildren(img);$('scan-info').textContent='Lokale Vorschau: '+file.name+' · '+Math.round(file.size/1024)+' KB. Nicht hochgeladen.'});
$('new').onclick=()=>render('dispatch');$('export').onclick=download;$('toggle-menu').onclick=()=>$('nav').classList.toggle('open');setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});const el=$('shiftClock');if(el)el.textContent=duration(active())},1000);window.addEventListener('pagehide',stopGPS);window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{const next=JSON.parse(e.newValue);if(Array.isArray(next.rides)){s=next;render(page)}}catch{}}});$('clock').textContent=new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});render(new URLSearchParams(location.search).get('mode')==='driver'?'driver':'dashboard');if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
