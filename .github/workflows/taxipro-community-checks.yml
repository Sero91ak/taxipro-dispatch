name: TaxiPro 2.3 – Community- und Arbeitszeit-Tests
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'v2/**'
      - 'tests/community-policy.test.mjs'
      - 'tests/in-app-trip-focus.test.mjs'
      - 'tests/time-summary.test.mjs'
      - '.github/workflows/taxipro-community-checks.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'v2/**'
      - 'tests/community-policy.test.mjs'
      - 'tests/in-app-trip-focus.test.mjs'
      - 'tests/time-summary.test.mjs'
      - '.github/workflows/taxipro-community-checks.yml'
permissions:
  contents: read
jobs:
  verify-community:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax of staff community and frontend
        run: |
          node --check backend/worker.js
          node --check backend/community.js
          node --check backend/time-summary.js
          node --check v2/app.js
          node --check v2/community-ui.js
          node --check v2/sw.js
      - name: Check staff-only traffic, shift swaps, privacy, uploads and worktime
        run: node --experimental-sqlite --test tests/community-policy.test.mjs tests/time-summary.test.mjs tests/in-app-trip-focus.test.mjs
