name: TaxiPro 2.2 – Code & API Tests
on:
  push:
    branches: [main, taxipro-full-v22-20261030]
    paths:
      - 'v2/**'
      - 'backend/**'
      - 'tests/**'
      - '.github/workflows/taxipro-v2-checks.yml'
  pull_request:
    paths:
      - 'v2/**'
      - 'backend/**'
      - 'tests/**'
      - '.github/workflows/taxipro-v2-checks.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check backend/worker.js
          node --check backend/community.js
          node --check backend/time-summary.js
          node --check v2/app.js
          node --check v2/sw.js
          node --check traffic-module.js
          node --check service-worker.js
          node --check scripts/update-traffic-feed.mjs
      - name: Verify role isolation, recurring trips, shifts, pauses, GPS and account security
        run: node --experimental-sqlite tests/api-integration.mjs
      - name: Verify Berlin worktime calculation and DST rollover
        run: node --test tests/time-summary.test.mjs
      - name: Verify official traffic feed normalization and failure handling
        run: node --test tests/traffic-feed.test.mjs tests/traffic-ui.test.mjs tests/traffic-guest.test.mjs
      - name: Verify PWA cache freshness and offline fallback
        run: node --test tests/sw-cache.test.mjs
