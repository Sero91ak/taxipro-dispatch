name: TaxiPro – kostenlose Verkehrsdaten (Autobahn)
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update-traffic-feed.mjs'
      - '.github/workflows/traffic-feed.yml'
permissions:
  contents: write
concurrency:
  group: taxipro-traffic-feed
  cancel-in-progress: false
jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Amtliche Daten laden (kein kostenpflichtiger Anbieter)
        run: node scripts/update-traffic-feed.mjs
      - name: Öffentliche Datei aktualisieren
        run: |
          if git diff --quiet -- traffic-feed.json; then
            echo "Keine Änderungen"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traffic-feed.json
          git commit -m "chore(traffic): amtliche Meldungen erneuern [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
